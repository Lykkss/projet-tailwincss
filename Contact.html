<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Club Auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="src/js/script.js" defer></script>
</head>
<body class="bg-gray-100">

    <!-- Placeholder du Header -->
    <div id="header-placeholder"></div>

    <!-- SECTION BANDEAU AVEC IMAGE -->
    <div class="relative w-full h-[400px] flex items-center justify-center -mt-20 z-[-10]">
        <img src="asset/vehicule1.jpg" alt="Bandeau Accueil" class="absolute inset-0 w-full h-full object-cover">
    </div>

     <!-- FORMULAIRE DE CONTACT CENTRÉ -->
     <div class="container mx-auto px-6 relative -mt-40 flex justify-center">
        <div class="bg-white p-10 rounded-lg shadow-lg w-[90%] md:w-[70%] lg:w-[60%] max-w-5xl">
            <h2 class="text-3xl font-bold text-gray-900 mb-6 text-start">Contactez-nous</h2>
            <form>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-gray-700 font-light">Prénom*</label>
                            <input type="text" class="w-full p-3 bg-gray-200 text-gray-700" placeholder="Entrez votre prénom">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-light">Nom*</label>
                            <input type="text" class="w-full p-3 border  bg-gray-200 text-gray-700" placeholder="Entrez votre nom">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-light">Email*</label>
                            <input type="email" class="w-full p-3 border bg-gray-200 text-gray-700" placeholder="Entrez une adresse mail valide">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-light">Téléphone</label>
                            <input type="text" class="w-full p-3 border bg-gray-200 text-gray-700" placeholder="Phone number">
                        </div>
                    </div>
                    <!-- Champ Message tout à droite -->
                    <div class="md:col-span-1">
                        <label class="block text-gray-700 font-light">Message</label>
                        <textarea class="w-full h-full p-3 border bg-gray-200 text-gray-700 min-h-[120px]" placeholder="Écrivez votre message"></textarea>
                    </div>
                </div>
                <div class="mt-10 text-end mr-32">
                    <button type="submit" class="bg-[#6C98E1] text-white text-lg font-bold px-6 py-3 hover:bg-blue-600 transition">
                        ENVOYEZ
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Placeholder du Footer -->
    <div id="footer-placeholder" class="mt-16"></div>

</body>
</html>
